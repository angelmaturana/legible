<footer class="site-footer">
        <div class="footer-grid">
            <div class="footer-brand">
                <p class="footer-entity"><strong>{{site_name}}</strong> {{ui_footer_based_in}} <strong>{{location}}</strong>. {{site_description}}</p>
                <div class="footer-brand-row">
                    <a href="/" class="footer-logo" aria-label="{{site_name}}, {{ui_home_aria}}">
                        <img src="/images/logo.svg" alt="{{site_name}}" width="120" height="35" loading="lazy" decoding="async">
                    </a>
                    {{footer_contact}}
                </div>
            </div>
            
            <nav class="footer-nav" aria-label="{{ui_footer_site}}">
                <p class="footer-nav-title">{{ui_footer_site}}</p>
                {{footer_nav}}
            </nav>

            <nav class="footer-nav" aria-label="{{ui_footer_legal}}">
                <p class="footer-nav-title">{{ui_footer_legal}}</p>
                {{legal_nav}}
            </nav>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; {{year}} {{site_name}}. {{ui_rights_reserved}}</p>
        </div>

    </footer>
