<header class="site-header">
<div class="page-width">
            <a class="brand" href="/" aria-label="{{site_name}}, {{ui_home_aria}}">
                <img class="brand-logo" src="/images/logo.svg" alt="{{site_name}}" width="300" height="87" loading="eager" fetchpriority="high" decoding="async">
            </a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="{{ui_open_menu}}">
            <label for="nav-toggle" class="nav-toggle-label"><span aria-hidden="true"></span></label>
            <nav aria-label="{{ui_main_navigation}}">
                {{nav}}
            </nav>
        </div>
</header>
