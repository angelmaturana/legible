<header class="site-header">
<div class="page-width">
            <a class="brand" href="/" aria-label="{{site_name}}, home">
                <img class="brand-logo" src="/images/logo.svg" alt="{{site_name}}" width="300" height="100" loading="eager" fetchpriority="high" decoding="async">
            </a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
            <label for="nav-toggle" class="nav-toggle-label"><span aria-hidden="true"></span></label>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="/category/">Categories</a></li>
                    {{nav_guides}}
                    {{nav_blog}}
                    <li><a href="/about/">About</a></li>
                    <li><a class="nav-action" href="/contact/">{{contact_action_cta}}</a></li>
                </ul>
            </nav>
        </div>
</header>
